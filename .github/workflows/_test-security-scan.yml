# TEMPORARY self-test caller for the security-scan reusable. Validates the
# tooling fixes (grype v6, OSS gitleaks, SPDX header check) on this branch
# before the v1 tag is moved. Removed before merge to main.
name: _test-security-scan

on:
  workflow_dispatch: {}
  push:
    branches: [fix/security-scan-tooling]

jobs:
  scan:
    uses: ./.github/workflows/security-scan.yml
    with:
      package-name: selftest
      fail-on-severity: high
    permissions:
      contents: read
      security-events: write
