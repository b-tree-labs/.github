#
# B-Tree Labs — reusable security scan workflow.
#
# OSS-only tool stack: grype for vulnerability scanning, REUSE for
# license-compliance lint, gitleaks for secret detection. Runs on PR and
# on a weekly schedule set by the consumer.
#
# Consumer usage (supports schedule in the caller):
#     name: security
#     on:
#       pull_request:
#       schedule:
#         - cron: '0 7 * * 1'   # Mondays 07:00 UTC
#     jobs:
#       scan:
#         uses: b-tree-labs/.github/.github/workflows/security-scan.yml@v1
#         with:
#           package-name: dendra

name: security-scan

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package import name (for logging).'
        type: string
        required: true
      fail-on-severity:
        description: 'grype severity threshold at which the job fails (negligible, low, medium, high, critical).'
        type: string
        default: 'high'
      reuse-enabled:
        description: 'Run REUSE license-compliance check.'
        type: boolean
        default: true
      gitleaks-enabled:
        description: 'Run gitleaks secret-detection scan.'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  vulnerabilities:
    name: Vulnerability scan (grype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # No `cache: pip` — it hard-fails on repos without a root
          # requirements.txt/pyproject.toml, and this scan must run anywhere.
      - name: Build SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Scan (grype)
        uses: anchore/scan-action@v6
        id: grype
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: ${{ inputs.fail-on-severity }}
          output-format: sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  license:
    # Header-presence check, not full REUSE-spec lint. B-Tree repos use a
    # split-license model — LICENSE.md is the map-of-record and every source
    # file carries an SPDX-License-Identifier — so they intentionally have no
    # LICENSES/ dir, which fsfe/reuse-action@v4 hard-requires (it failed every
    # run). We enforce what the policy actually requires: no tracked source
    # file ships without a copyright + SPDX header.
    name: License compliance (SPDX headers)
    if: inputs.reuse-enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers on tracked source files
        run: |
          set -euo pipefail
          # Require headers on first-party CODE only. YAML/config and
          # user-facing templates are intentionally excluded — adding our
          # copyright to a template a consumer copies would be wrong, and
          # config files (.pre-commit-config, etc.) aren't source.
          mapfile -t files < <(git ls-files \
            '*.py' '*.ts' '*.tsx' '*.js' '*.mjs' '*.sh' \
            ':!:**/__postrule_generated__/**' \
            ':!:**/node_modules/**' \
            ':!:**/*.min.js' \
            ':!:**/*template*' \
            ':!:**/vendor/**')
          missing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            if ! grep -qm1 'SPDX-License-Identifier:' "$f"; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing SPDX-License-Identifier header in ${#missing[@]} file(s):"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All ${#files[@]} tracked source files carry an SPDX header."

  secrets:
    name: Secret scan (gitleaks)
    if: inputs.gitleaks-enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the OSS gitleaks binary directly. The gitleaks-action@v2 wrapper
      # now requires a paid GITLEAKS_LICENSE for org repos; the CLI itself is
      # free (MIT). detect over full history; redact secrets from logs.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
